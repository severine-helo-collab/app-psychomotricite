<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestion du Cabinet Médical</title>
  <!-- Styles Bootstrap et Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <style>
    body {
      background-color: #f8f9fa;
    }
    .sidebar {
      min-height: 100vh;
      background-color: #343a40;
    }
    .sidebar a {
      color: #cfd8dc;
      text-decoration: none;
    }
    .sidebar a.active, .sidebar a:hover {
      color: #ffffff;
      background-color: #495057;
    }
    .card-custom {
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>

  <!-- Conteneur Principal -->
  <div class="container-fluid">
    <div class="row">
      
      <!-- Barre de Navigation Latérale -->
      <nav class="col-md-3 col-lg-2 d-md-block sidebar collapse p-3">
        <h4 class="text-white text-center mb-4"><i class="bi bi-hospital"></i> Cabinet</h4>
        <ul class="nav nav-pills flex-column mb-auto">
          <li class="nav-item mb-2">
            <a href="#" class="nav-link active" id="nav-patients">
              <i class="bi bi-people me-2"></i> Patients
            </a>
          </li>
          <li class="nav-item mb-2">
            <a href="#" class="nav-link" id="nav-rendezvous">
              <i class="bi bi-calendar-check me-2"></i> Rendez-vous
            </a>
          </li>
        </ul>
      </nav>

      <!-- Contenu Principal -->
      <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">

        <!-- SECTION PATIENTS -->
        <section id="section-patients">
          <div class="d-flex justify-content-between align-items-center mb-4">
            <h2><i class="bi bi-people-fill text-primary"></i> Liste des Patients</h2>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addPatientModal">
              <i class="bi bi-person-plus-fill"></i> Ajouter un Patient
            </button>
          </div>

          <!-- Barre de recherche -->
          <div class="mb-3">
            <input type="text" id="searchPatient" class="form-control" placeholder="Rechercher un patient par nom ou prénom...">
          </div>

          <!-- Tableau des Patients -->
          <div class="card card-custom p-3">
            <div class="table-responsive">
              <table class="table table-hover align-middle">
                <thead class="table-light">
                  <tr>
                    <th>Nom</th>
                    <th>Prénom</th>
                    <th>Téléphone</th>
                    <th>Email</th>
                    <th>Adresse</th>
                    <th class="text-end">Actions</th>
                  </tr>
                </thead>
                <tbody id="patients-table-body">
                  <!-- Chargement dynamique des patients -->
                </tbody>
              </table>
            </div>
          </div>
        </section>

        <!-- SECTION RENDEZ-VOUS -->
        <section id="section-rendezvous" style="display: none;">
          <div class="d-flex justify-content-between align-items-center mb-4">
            <h2><i class="bi bi-calendar-event-fill text-success"></i> Gestion des Rendez-vous</h2>
            <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#addRendezvousModal">
              <i class="bi bi-calendar-plus-fill"></i> Nouveau Rendez-vous
            </button>
          </div>

          <div class="card card-custom p-3">
            <div class="table-responsive">
              <table class="table table-hover align-middle">
                <thead class="table-light">
                  <tr>
                    <th>Patient</th>
                    <th>Date & Heure</th>
                    <th>Motif</th>
                    <th>Statut</th>
                    <th class="text-end">Actions</th>
                  </tr>
                </thead>
                <tbody id="rdv-table-body">
                  <!-- Chargement dynamique des RDV -->
                </tbody>
              </table>
            </div>
          </div>
        </section>

      </main>
    </div>
  </div>

  <!-- MODAL : AJOUTER UN PATIENT -->
  <div class="modal fade" id="addPatientModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title"><i class="bi bi-person-plus"></i> Nouveau Patient</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fermer"></button>
        </div>
        <form id="add-patient-form">
          <div class="modal-body">
            <div class="mb-3">
              <label class="form-label">Nom</label>
              <input type="text" id="nom" class="form-control" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Prénom</label>
              <input type="text" id="prenom" class="form-control" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Téléphone</label>
              <input type="tel" id="telephone" class="form-control">
            </div>
            <div class="mb-3">
              <label class="form-label">Email</label>
              <input type="email" id="email" class="form-control">
            </div>
            <div class="mb-3">
              <label class="form-label">Adresse</label>
              <input type="text" id="adresse" class="form-control" placeholder="123 rue Exemple, Paris">
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>
            <button type="submit" class="btn btn-primary">Enregistrer</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- MODAL : MODIFIER UN PATIENT -->
  <div class="modal fade" id="editPatientModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title"><i class="bi bi-pencil-square"></i> Modifier le Patient</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fermer"></button>
        </div>
        <form id="edit-patient-form">
          <input type="hidden" id="edit-patient-id">
          <div class="modal-body">
            <div class="mb-3">
              <label class="form-label">Nom</label>
              <input type="text" id="edit-nom" class="form-control" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Prénom</label>
              <input type="text" id="edit-prenom" class="form-control" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Téléphone</label>
              <input type="tel" id="edit-telephone" class="form-control">
            </div>
            <div class="mb-3">
              <label class="form-label">Email</label>
              <input type="email" id="edit-email" class="form-control">
            </div>
            <div class="mb-3">
              <label class="form-label">Adresse</label>
              <input type="text" id="edit-adresse" class="form-control">
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>
            <button type="submit" class="btn btn-primary">Mettre à jour</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- MODAL : NOUVEAU RENDEZ-VOUS -->
  <div class="modal fade" id="addRendezvousModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title"><i class="bi bi-calendar-plus"></i> Planifier un Rendez-vous</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fermer"></button>
        </div>
        <form id="add-rdv-form">
          <div class="modal-body">
            <div class="mb-3">
              <label class="form-label">Patient</label>
              <select id="rdv-patient-select" class="form-select" required>
                <!-- Chargement dynamique de la liste des patients -->
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label">Date et Heure</label>
              <input type="datetime-local" id="rdv-date" class="form-control" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Motif</label>
              <input type="text" id="rdv-motif" class="form-control" placeholder="Consultation générale, suivi...">
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>
            <button type="submit" class="btn btn-success">Planifier</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Scripts Bootstrap & Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Script personnalisé -->
  <script src="script.js"></script>
</body>
</html>
