<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cabinet de Psychomotricité</title>
  <link rel="stylesheet" href="style.css">
  <!-- Script Supabase JS -->
<!-- Script Supabase JS avec chargement garanti -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
</head>
<body>

  <!-- ÉCRAN DE CONNEXION (Visible par défaut) -->
  <div id="login-section" class="auth-container">
    <form id="login-form">
      <h2>Connexion Cabinet</h2>
      <p>Veuillez vous identifier pour accéder au dossier patient.</p>
      <input type="email" id="login-email" placeholder="Adresse email" required>
      <input type="password" id="login-password" placeholder="Mot de passe" required>
      <button type="submit">Se connecter</button>
      <p id="auth-error" class="error-msg"></p>
    </form>
  </div>

  <!-- APPLICATION PRINCIPALE (Masquée tant qu'on n'est pas connecté) -->
  <div id="app-section" class="hidden">
    <header>
      <h1>Cabinet de Psychomotricité</h1>
      <nav>
        <button class="nav-btn active" onclick="showSection('dashboard')">📊 Tableau de bord</button>
        <button class="nav-btn" onclick="showSection('add-patient')">➕ Nouveau patient</button>
        <button class="nav-btn logout-btn" onclick="logout()">🔒 Déconnexion</button>
      </nav>
    </header>

    <main>
      <!-- Tableau de bord -->
      <section id="dashboard" class="page-section">
        <h2>Liste des patients</h2>
        <div id="patient-list">
          <!-- Les patients s'afficheront ici -->
        </div>
      </section>

      <!-- Formulaire d'ajout -->
      <section id="add-patient" class="page-section hidden">
        <h2>Ajouter un patient</h2>
        <form id="patient-form">
          <input type="text" id="nom" placeholder="Nom" required>
          <input type="text" id="prenom" placeholder="Prénom" required>
          <input type="date" id="date_naissance" required>
          <button type="submit">Enregistrer</button>
        </form>
      </section>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
