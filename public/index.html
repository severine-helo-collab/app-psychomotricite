<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cabinet de Psychomotricité - Héloïse Rondeau</title>
  <link rel="stylesheet" href="style.css">

  <!-- 1. Bibliothèque Supabase via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- 2. Votre script JavaScript principal -->
  <script src="app.js" defer></script>
</head>
<body>

  <div class="container">
    
    <!-- En-tête -->
    <header>
      <h1>Héloïse Rondeau</h1>
      <p>Psychomotricienne — Cabinet du Grand Louis</p>
    </header>

    <!-- Bloc 1 : Connexion (Visible au démarrage) -->
    <section id="auth-section" class="card">
      <h2>Connexion</h2>
      <form id="auth-form">
        <div class="form-group">
          <label for="auth-email">Adresse Email</label>
          <input type="email" id="auth-email" required placeholder="exemple@email.com">
        </div>
        <div class="form-group">
          <label for="auth-password">Mot de passe</label>
          <input type="password" id="auth-password" required placeholder="••••••••">
        </div>
        <div class="btn-group">
          <button type="submit">Se connecter</button>
        </div>
      </form>
    </section>

    <!-- Bloc 2 : Tableau de bord (Masqué au démarrage avec class="hidden") -->
    <main id="dashboard" class="hidden">
      
      <!-- Bouton de déconnexion -->
      <div style="text-align: right; margin-bottom: 1rem;">
        <button id="logout-btn" class="btn-secondary">Déconnexion</button>
      </div>

      <!-- Formulaire Nouveau Patient -->
      <section class="card">
        <h2>Nouveau Patient</h2>
        <form id="patient-form">
          <div class="form-group">
            <label for="patient-nom">Nom</label>
            <input type="text" id="patient-nom" required>
          </div>
          <div class="form-group">
            <label for="patient-prenom">Prénom</label>
            <input type="text" id="patient-prenom" required>
          </div>
          <div class="form-group">
            <label for="patient-dob">Date de naissance</label>
            <input type="date" id="patient-dob" required>
          </div>
          <div class="form-group">
            <label for="patient-tel">Téléphone</label>
            <input type="tel" id="patient-tel">
          </div>
          <div class="form-group">
            <label for="patient-email">Email</label>
            <input type="email" id="patient-email">
          </div>
          <div class="btn-group">
            <button type="button" class="btn-secondary">Annuler</button>
            <button type="submit">Enregistrer</button>
          </div>
        </form>
      </section>

      <!-- Formulaire Rendez-vous -->
      <section class="card">
        <h2>Programmer un Rendez-vous</h2>
        <form id="rdv-form">
          <div class="form-group">
            <label for="rdv-patient">Patient</label>
            <select id="rdv-patient" required>
              <option value="">-- Choisir un patient --</option>
            </select>
          </div>
          <div class="form-group">
            <label for="rdv-datetime">Date et Heure</label>
            <input type="datetime-local" id="rdv-datetime" required>
          </div>
          <div class="form-group">
            <label for="rdv-motif">Motif</label>
            <input type="text" id="rdv-motif" value="Bilan psychomoteur">
          </div>
          <div class="form-group">
            <label for="rdv-tarif">Tarif (€)</label>
            <input type="number" id="rdv-tarif" value="50">
          </div>
          <div class="form-group">
            <label for="rdv-statut">Statut</label>
            <select id="rdv-statut">
              <option value="En attente">En attente</option>
              <option value="Confirmé">Confirmé</option>
              <option value="Annulé">Annulé</option>
            </select>
          </div>
          <div class="btn-group">
            <button type="button" class="btn-secondary">Annuler</button>
            <button type="submit">Enregistrer le RDV</button>
          </div>
        </form>
      </section>

    </main>

  </div>

</body>
</html>
